[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# CI backends to support
ci = "github"
# The release workflow keeps a deliberate publication allowlist for GitHub assets.
allow-dirty = ["ci"]
# Extra setup steps to run before every release build.
github-build-setup = "../release-check.yml"
# Keep the repository-owned scripts/install.sh as the supported installer.
installers = []
# Release source archives are not distribution artifacts; source remains on GitHub.
source-tarball = false
# Target platforms to build apps for (Rust target-triple syntax).
# Keep these aligned with scripts/install.sh and scripts/verify-release.py.
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-unknown-linux-musl",
  "x86_64-unknown-linux-musl",
]
# Which actions to run on pull requests
pr-run-mode = "plan"
