name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: make check
      - name: Install dependency assurance tools
        run: |
          cargo install --locked --version 0.20.2 cargo-deny
          cargo install --locked --version 0.19.0 cargo-outdated
      - name: Check dependency assurance
        run: make dependency-assurance
